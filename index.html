<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Monitor de Proyectos · wmlumen</title>
  <!-- API-Visitas Tracking -->
  <script src="https://api-visitas-ei0d.onrender.com/track?project=monitor&page=index" async></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --border: #334155; --green: #22c55e; --yellow: #f59e0b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 2rem; text-align: center; border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--muted); font-size: 0.9rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 0.75rem; padding: 1rem; text-align: center;
    }
    .stat-card .val { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

    .filter-bar {
      display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .filter-bar input {
      flex: 1; min-width: 200px; padding: 0.6rem 1rem; background: var(--card);
      border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text);
      font-size: 0.9rem; outline: none;
    }
    .filter-bar input:focus { border-color: var(--accent); }

    /* Mapa */
    #map {
      height: 380px;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .project-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1rem;
    }
    .project-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 0.75rem; padding: 1.25rem; transition: transform 0.15s, border-color 0.15s;
    }
    .project-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .project-card .name {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .project-card .name a { color: var(--text); text-decoration: none; }
    .project-card .name a:hover { color: var(--accent); }
    .project-card .desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
    .project-card .meta {
      display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted);
    }
    .project-card .meta span { display: flex; align-items: center; gap: 0.25rem; }
    .project-card .meta .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-active { background: var(--green); }
    .dot-inactive { background: var(--yellow); }
    .dot-none { background: #475569; }

    .project-card .actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn {
      padding: 0.35rem 0.75rem; border-radius: 0.4rem; font-size: 0.75rem;
      font-weight: 600; text-decoration: none; cursor: pointer; border: none;
      display: inline-flex; align-items: center; gap: 0.25rem;
    }
    .btn-gh { background: #24292f; color: #fff; }
    .btn-gh:hover { background: #30363d; }
    .btn-live { background: var(--accent); color: #0f172a; }
    .btn-live:hover { opacity: 0.9; }

    .btn-share {
      padding: 0.3rem 0.55rem; border-radius: 0.35rem; font-size: 0.65rem;
      font-weight: 600; text-decoration: none; cursor: pointer; border: none;
      color: #fff; display: inline-flex; align-items: center; gap: 0.2rem;
      transition: opacity 0.15s;
    }
    .btn-share:hover { opacity: 0.85; }
    .btn-share-wa { background: #25D366; }
    .btn-share-tw { background: #000; }
    .btn-share-fb { background: #1877F2; }
    .share-count { font-size: 0.7rem; color: var(--muted); margin-left: 0.25rem; }

    .no-results { text-align: center; padding: 3rem; color: var(--muted); }

    .footer { text-align: center; padding: 1.5rem; color: #475569; font-size: 0.75rem; }
    .tag { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 0.25rem; font-size: 0.65rem; font-weight: 600; }
    .tag-api { background: rgba(56,189,248,.2); color: var(--accent); }
    .tag-web { background: rgba(34,197,94,.2); color: var(--green); }
    .tag-html { background: rgba(245,158,11,.2); color: var(--yellow); }

    @media (max-width: 600px) {
      .header { padding: 1.2rem; }
      .header h1 { font-size: 1.3rem; }
      .project-grid { grid-template-columns: 1fr; }
      .container { padding: 0.8rem; }
      #map { height: 260px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 <span>Monitor</span> de Proyectos</h1>
    <p>wmlumen · GitHub · Tracking por API-Visitas</p>
  </div>

  <div class="container">
    <!-- Stats Global -->
    <div class="stats-bar">
      <div class="stat-card"><div class="val" id="totalProjects">—</div><div class="lbl">Proyectos</div></div>
      <div class="stat-card"><div class="val" id="totalVisits">—</div><div class="lbl">Visitas totales</div></div>
      <div class="stat-card"><div class="val" id="totalUnique">—</div><div class="lbl">Únicos hoy</div></div>
      <div class="stat-card"><div class="val" id="totalToday">—</div><div class="lbl">Visitas hoy</div></div>
      <div class="stat-card"><div class="val" id="avgTime">—</div><div class="lbl">Promedio (seg)</div></div>
    </div>

    <!-- Mapa de visitas -->
    <div id="map"></div>

    <!-- Filtro -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 Buscar proyecto..." oninput="filterProjects()">
    </div>

    <!-- Grid -->
    <div class="project-grid" id="projectGrid">
      <div class="no-results">Cargando proyectos...</div>
    </div>
  </div>

  <div class="footer">
    Powered by <a href="https://api-visitas-ei0d.onrender.com" target="_blank" style="color:var(--accent);">API-Visitas</a> · 
    <span id="footerTime"></span>
  </div>

<script>
// ─── Datos de proyectos ───────────────────────────────────
const projects = [
  { id: "Calificaciones.py", desc: "Escala de calificaciones MEC Paraguay — sitio estático", gh: "wmlumen/Calificaciones.py", live: "https://calificaciones-py.vercel.app", type: "html", tracked: true },
  { id: "API-Visitas", desc: "API de tracking de visitas con geolocalización y mapa", gh: "wmlumen/API-Visitas", live: "https://api-visitas-ei0d.onrender.com", type: "api", tracked: false },
  { id: "api-calificaciones", desc: "API REST para escalas de calificaciones (MEC Paraguay)", gh: "wmlumen/api-calificaciones", live: null, type: "api", tracked: true },
  { id: "api-escuelas-py", desc: "API REST para datos de establecimientos educativos de Paraguay", gh: "wmlumen/api-escuelas-py", live: null, type: "api", tracked: false },
  { id: "C-Sociologia", desc: "Evaluación de Sociología", gh: "wmlumen/C-Sociologia", live: null, type: "html", tracked: false },
  { id: "concurso", desc: "Sistema de concursos y llamados", gh: "wmlumen/concurso", live: null, type: "html", tracked: false },
  { id: "Api-BD", desc: "API base de datos", gh: "wmlumen/Api-BD", live: null, type: "html", tracked: false },
  { id: "monitoreo", desc: "Sistema de monitoreo ⭐", gh: "wmlumen/monitoreo", live: null, type: "html", tracked: false },
  { id: "GLSMRNP", desc: "Página Masónica", gh: "wmlumen/GLSMRNP", live: null, type: "html", tracked: false },
  { id: "VARK", desc: "Estilos de aprendizaje", gh: "wmlumen/VARK", live: null, type: "html", tracked: false },
  { id: "Ambiental", desc: "Scripts ambientales", gh: "wmlumen/Ambiental", live: null, type: "other", tracked: false },
  { id: "tienda", desc: "Tienda virtual", gh: "wmlumen/tienda", live: null, type: "html", tracked: false },
  { id: "mariachifarra", desc: "Página web Mariachi Farra", gh: "wmlumen/mariachifarra", live: null, type: "html", tracked: false },
  { id: "Academico", desc: "Sistema académico", gh: "wmlumen/Academico", live: null, type: "html", tracked: false },
];

const VISITAS_API = 'https://api-visitas-ei0d.onrender.com';

// ─── Mapa (inicializar dentro de DOMContentLoaded) ───────
let visitMap = null;
let markersLayer = null;

function initMap() {
  visitMap = L.map('map').setView([-23.4425, -58.4438], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18
  }).addTo(visitMap);
  markersLayer = L.layerGroup().addTo(visitMap);
  loadMapVisits();
}

async function loadMapVisits() {
  // Obtener ubicaciones de todos los proyectos trackeados
  const tracked = projects.filter(p => p.tracked);
  const cityAgg = {}; // key: "lat,lon" -> { lat, lon, city, country, count, projects: Set }

  for (const p of tracked) {
    try {
      const res = await fetch(`${VISITAS_API}/api/stats/locations?project=${p.id}`);
      const data = await res.json();
      const cities = data.cities || [];
      cities.forEach(c => {
        if (c.lat == null || c.lon == null) return;
        const key = `${c.lat.toFixed(4)},${c.lon.toFixed(4)}`;
        if (!cityAgg[key]) {
          cityAgg[key] = { lat: c.lat, lon: c.lon, city: c.city, country: c.country, count: 0, projects: new Set() };
        }
        cityAgg[key].count += c.count;
        cityAgg[key].projects.add(p.id);
      });
    } catch (e) { /* skip */ }
  }

  const locations = Object.values(cityAgg);
  if (locations.length === 0) {
    L.marker([-25.2867, -57.6470])
      .addTo(markersLayer)
      .bindPopup('<b>📍 Paraguay</b><br>Esperando datos...');
    return;
  }

  const maxCount = Math.max(...locations.map(l => l.count));
  const bounds = [];

  locations.forEach(loc => {
    // Radio proporcional: mínimo 6px, máximo 35px
    const radius = 6 + (loc.count / maxCount) * 29;
    const marker = L.circleMarker([loc.lat, loc.lon], {
      radius,
      fillColor: '#38bdf8',
      color: '#0f172a',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.7
    });
    const projList = [...loc.projects].join(', ');
    marker.bindPopup(`<b>📍 ${loc.city || '—'}, ${loc.country || '—'}</b><br>👁 ${loc.count} visitas<br><small>${projList}</small>`);
    marker.addTo(markersLayer);
    bounds.push([loc.lat, loc.lon]);
  });

  if (bounds.length > 0) {
    visitMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 10 });
  }
}

// ─── Carga inicial ───────────────────────────────────────
const pageStart = Date.now();

document.addEventListener('DOMContentLoaded', () => {
  initMap();
  loadStats();
  renderProjects(projects);
  clock();
  setInterval(clock, 1000);
  loadTimeStats();
});

// ─── Permanencia: enviar tiempo al salir ────────────────
window.addEventListener('beforeunload', () => {
  const elapsed = Math.round((Date.now() - pageStart) / 1000);
  if (elapsed > 1) {
    const payload = `${VISITAS_API}/track/time?project=monitor&seconds=${elapsed}`;
    if (navigator.sendBeacon) {
      navigator.sendBeacon(payload);
    } else {
      fetch(payload, { keepalive: true });
    }
  }
});

function clock() {
  document.getElementById('footerTime').textContent = new Date().toLocaleString('es-PY');
}

// ─── Cargar estadísticas globales ────────────────────────
async function loadStats() {
  try {
    const res = await fetch(`${VISITAS_API}/api/projects`);
    const data = await res.json();
    const trackedProjects = data.filter(p => p.name !== 'default' && p.name !== 'test_final' && p.name !== 'test_local');

    document.getElementById('totalProjects').textContent = trackedProjects.length;
    document.getElementById('totalVisits').textContent = trackedProjects.reduce((s, p) => s + (p.real_visits || 0), 0);
    document.getElementById('totalToday').textContent = trackedProjects.reduce((s, p) => s + (p.today_visits || 0), 0);
    document.getElementById('totalUnique').textContent = trackedProjects.reduce((s, p) => s + (p.unique_visitors || 0), 0);
  } catch (e) { /* silencioso */ }
}

// ─── Renderizar proyectos ────────────────────────────────
function renderProjects(list) {
  const grid = document.getElementById('projectGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="no-results">Sin resultados</div>';
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="project-card" data-name="${p.id.toLowerCase()}">
      <div class="name">
        <span class="dot ${p.tracked ? 'dot-active' : 'dot-none'}" title="${p.tracked ? 'Trackeado' : 'Sin tracking'}"></span>
        <a href="https://github.com/${p.gh}" target="_blank">${p.id}</a>
        ${p.type === 'api' ? '<span class="tag tag-api">API</span>' : ''}
        ${p.type === 'html' ? '<span class="tag tag-web">Web</span>' : ''}
      </div>
      <div class="desc">${p.desc}</div>
      <div class="meta">
        <span id="visits-${p.id}">📊 — visitas</span>
        <span id="unique-${p.id}">👤 — únicos</span>
        <span id="today-${p.id}">📅 — hoy</span>
        <span id="shares-${p.id}">🔗 — compartidos</span>
      </div>
      <div class="actions">
        <a href="https://github.com/${p.gh}" target="_blank" class="btn btn-gh">⬡ GitHub</a>
        ${p.live ? `<a href="${p.live}" target="_blank" class="btn btn-live">↗ Visitar</a>` : ''}
        <button class="btn-share btn-share-wa" onclick="shareProject('${p.id}','${p.desc}','https://github.com/${p.gh}','whatsapp')" title="Compartir en WhatsApp">📱</button>
        <button class="btn-share btn-share-tw" onclick="shareProject('${p.id}','${p.desc}','https://github.com/${p.gh}','twitter')" title="Compartir en X/Twitter">𝕏</button>
        <button class="btn-share btn-share-fb" onclick="shareProject('${p.id}','${p.desc}','https://github.com/${p.gh}','facebook')" title="Compartir en Facebook">f</button>
      </div>
    </div>
  `).join('');

  // Cargar stats individuales
  list.forEach(p => { loadProjectStats(p.id); loadShareStats(p.id); });
}

// ─── Stats por proyecto ──────────────────────────────────
async function loadProjectStats(projectName) {
  try {
    const res = await fetch(`${VISITAS_API}/api/stats/overview?project=${projectName}`);
    const data = await res.json();
    const vEl = document.getElementById(`visits-${projectName}`);
    const uEl = document.getElementById(`unique-${projectName}`);
    const tEl = document.getElementById(`today-${projectName}`);
    if (vEl) vEl.innerHTML = `📊 <strong>${data.total || 0}</strong> visitas`;
    if (uEl) uEl.innerHTML = `👤 <strong>${data.unique_visitors || 0}</strong> únicos`;
    if (tEl) tEl.innerHTML = `📅 <strong>${data.today || 0}</strong> hoy`;
  } catch (e) { /* sin datos */ }
}

async function loadShareStats(projectName) {
  try {
    const res = await fetch(`${VISITAS_API}/api/stats/shares?project=${projectName}`);
    const data = await res.json();
    const el = document.getElementById(`shares-${projectName}`);
    if (el) el.innerHTML = `🔗 <strong>${data.total || 0}</strong> compartidos`;
  } catch (e) { /* sin datos */ }
}

// ─── Compartir proyecto ─────────────────────────────────
function shareProject(projectId, desc, url, platform) {
  const shareUrl = encodeURIComponent(url);
  const shareText = encodeURIComponent(`${projectId}: ${desc}`);
  let link = '';
  switch (platform) {
    case 'whatsapp': link = `https://wa.me/?text=${shareText}%20${shareUrl}`; break;
    case 'twitter': link = `https://x.com/intent/tweet?text=${shareText}&url=${shareUrl}`; break;
    case 'facebook': link = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`; break;
  }
  // Track share
  fetch(`${VISITAS_API}/track/share?project=${projectId}&platform=${platform}&page=${encodeURIComponent(url)}`, { keepalive: true });
  // Actualizar contador local
  const el = document.getElementById(`shares-${projectId}`);
  if (el) {
    const match = el.innerHTML.match(/(\d+)/);
    const count = (match ? parseInt(match[1]) : 0) + 1;
    el.innerHTML = `🔗 <strong>${count}</strong> compartidos`;
  }
  if (link) window.open(link, '_blank', 'noopener');
}

// ─── Tiempo promedio global ─────────────────────────────
async function loadTimeStats() {
  try {
    const res = await fetch(`${VISITAS_API}/api/stats/time?project=monitor`);
    const data = await res.json();
    const el = document.getElementById('avgTime');
    if (el) el.textContent = data.avg_seconds >= 60
      ? `${Math.round(data.avg_seconds / 60)}m`
      : `${data.avg_seconds}s`;
  } catch (e) { /* sin datos */ }
}

// ─── Filtro ──────────────────────────────────────────────
function filterProjects() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = projects.filter(p =>
    p.id.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
  );
  renderProjects(filtered);
}
</script>
</body>
</html>
